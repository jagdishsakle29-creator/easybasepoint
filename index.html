<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EasyBasePoint - Smart Quota & Rewards Platform</title>
    <meta name="description" content="EasyBasePoint - Modern fintech quota, top up and rewards platform with real-time tracking and transparent rate calculations." />
    
    <!-- Open Graph / Instagram / WhatsApp / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://easybasepoint.vercel.app/" />
    <meta property="og:site_name" content="EasyBasePoint" />
    <meta property="og:title" content="EasyBasePoint - Smart Quota & 22% Daily Returns" />
    <meta property="og:description" content="Instant UPI & Bank Withdrawals within 5-15 mins. Get 22% guaranteed return on every deposit." />
    <meta property="og:image" content="https://easybasepoint.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://easybasepoint.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EasyBasePoint Official Platform" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://easybasepoint.vercel.app/" />
    <meta name="twitter:title" content="EasyBasePoint - Smart Quota & 22% Daily Returns" />
    <meta name="twitter:description" content="Instant UPI & Bank Withdrawals within 5-15 mins. Get 22% guaranteed return on every deposit." />
    <meta name="twitter:image" content="https://easybasepoint.vercel.app/og-image.jpg" />

    <!-- Mobile App Theme Color & PWA -->
    <meta name="theme-color" content="#0B1528" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EasyBase" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Prevent stale caching on mobile devices -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Modern Inter typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F3F6FD] text-slate-800 font-sans antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('ebp:can-install-pwa', { detail: e }));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
